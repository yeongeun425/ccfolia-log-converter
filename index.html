<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연근표 코코포 로그 백업기</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --sidebar-bg: #252538;
            --box-bg: #2d2d44;
            --text-color: #cdd6f4;
            --accent-color: #74c7ec;
            --border-color: #45475a;
            --danger-color: #f38ba8;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar-left {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .workspace {
            flex: 1;
            display: flex;
            height: 100%;
            overflow: hidden;
        }

        .main-editor {
            width: 50%; 
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            padding: 20px;
            box-sizing: border-box;
            height: 100%;
        }

        .sidebar-right {
            flex: 1; /* 메인 에디터 크기에 맞춰 남은 공간을 유연하게 채움 */
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            height: 100%;
        }

        .resizer {
            width: 6px;
            background: var(--border-color);
            cursor: col-resize;
            transition: background 0.2s;
            z-index: 10;
            flex-shrink: 0;
        }
        .resizer:hover, .resizer.dragging {
            background: var(--accent-color);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 0;
        }
        .sidebar-header h3 {
            margin: 0;
            border: none;
            padding: 0;
        }

        h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--accent-color);
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        .config-group input, .config-group select {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #tagColorContainer {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tag-color-row {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .tag-color-row span {
            font-weight: bold;
            font-size: 14px;
            word-break: break-all;
            cursor: pointer;
            user-select: none;
        }
        .tag-color-row span:hover {
            text-decoration: underline;
            color: var(--accent-color) !important;
        }
        .tag-color-row input[type="color"] {
            width: 50px;
            height: 28px;
            padding: 0;
            border: 1px solid var(--border-color);
            cursor: pointer;
            background: none;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .character-manager {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .char-item-row {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .char-item-row .char-inline {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .char-item-row input[type="text"] {
            flex: 1;
            font-size: 12px;
            padding: 5px;
        }
        .char-item-row input[type="color"] {
            width: 35px;
            height: 28px;
            padding: 0;
            border: none;
            cursor: pointer;
            background: none;
        }
        .char-item-row .checkbox-label {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .char-delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .log-container {
            flex: 1;
            background: #11111b;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.2s, background-color 0.2s;
            position: relative;
        }

        .log-container.dragover {
            border-color: var(--accent-color) !important;
            background: #313244 !important;
            box-shadow: inset 0 0 15px rgba(116, 199, 236, 0.2);
        }

        .log-container::before {
            content: "로그 파일을 끌어다 놓으세요.";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #585b70;
            font-size: 13px;
            text-align: center;
            pointer-events: none;
            width: 80%;
            line-height: 1.5;
            display: block;
            white-space: pre-line;
        }
        .log-container.has-items::before {
            display: none;
        }

        .log-card {
            background: #212121;
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 6px;
            cursor: grab;
            user-select: none;
            font-size: 14px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease;
        }
        .log-card:active {
            cursor: grabbing;
        }
        .log-card.dragging {
            opacity: 0.3;
            border: 1px dashed var(--accent-color);
        }
        .log-card:hover {
            box-shadow: inset 0 0 0 1px var(--accent-color);
        }

        .card-avatar {
            width: 28px;
            height: 28px;
            border-radius: 2px;
            object-fit: cover;
            object-position: top center;
            border: 1px solid var(--border-color);
            background: #45475a;
            display: none;
        }

        .tab-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            height: fit-content;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: #89b4fa;
            color: #11111b;
        }

        .speaker-name {
            font-weight: bold;
            min-width: 85px;
            text-align: right;
            border-right: 2px solid var(--border-color);
            padding-right: 10px;
        }

        .log-content {
            flex: 1;
            word-break: break-all;
        }

        .card-inline-editor {
            flex: 1;
            background: #11111b;
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 4px 6px;
            font-size: 14px;
            font-family: inherit;
            border-radius: 4px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
        }

        .action-btn {
            background: var(--accent-color);
            color: #11111b;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        
        .clear-btn {
            background: var(--danger-color);
            color: #11111b;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .clear-btn:hover {
            opacity: 0.9;
        }

        .checkbox-label {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="sidebar-left">
            <div class="config-group">
                <h3>기본 설정</h3>
                <label>세션명</label>
                <input type="text" id="sessionTitle" value="" placeholder="세션명을 입력하세요">
                
                <label class="checkbox-label" style="margin-top: 8px;">
                    <input type="checkbox" id="hideContinuousName" checked> 연속 발언 시 이름 생략
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="enableColoringDice" checked> 판정 결과 색상 강조
                </label>
            </div>

            <div class="config-group">
                <h3>🏷️ 탭별 배경색 설정</h3>
                <div id="tagColorContainer"></div>
            </div>

            <div class="config-group character-manager">
                <h3>👥 캐릭터 설정</h3>
                <button class="action-btn" id="addCharBtn" style="background: #cba6f7;">+ 캐릭터 추가</button>
                <div id="characterListContainer"></div>
            </div>
            
            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
                <button class="action-btn" id="copyBtn" style="background:#f9e2af; padding: 12px; font-size: 15px;">📋 클립보드에 복사</button>
                <button class="action-btn" id="saveBtn" style="background:#a6e3a1; padding: 12px; font-size: 15px;">💾 변환 파일 다운로드</button>
            </div>
        </div>

        <div class="workspace" id="workspace">
            
            <div class="main-editor" id="mainEditor">
                <h3>📝 메인 로그</h3>
                <div class="log-container" id="mainLogContainer"></div>
            </div>

            <div class="resizer" id="resizer"></div>

            <div class="sidebar-right" id="sidebarRight">
                <div class="sidebar-header">
                    <h3>📥 서브 로그</h3>
                    <button class="clear-btn" id="clearSubLogBtn">일괄 삭제</button>
                </div>
                <div class="log-container" id="subLogContainer"></div>
            </div>

        </div>

    </div>

    <script>
        const mainLogContainer = document.getElementById('mainLogContainer');
        const subLogContainer = document.getElementById('subLogContainer');
        const clearSubLogBtn = document.getElementById('clearSubLogBtn');
        const saveBtn = document.getElementById('saveBtn');
        const sessionTitle = document.getElementById('sessionTitle');
        const addCharBtn = document.getElementById('addCharBtn');
        const characterListContainer = document.getElementById('characterListContainer');
        const hideContinuousName = document.getElementById('hideContinuousName');
        const enableColoringDice = document.getElementById('enableColoringDice');
        const tagColorContainer = document.getElementById('tagColorContainer');
        
        const workspace = document.getElementById('workspace');
        const mainEditor = document.getElementById('mainEditor');
        const sidebarRight = document.getElementById('sidebarRight');
        const resizer = document.getElementById('resizer');

        let charactersConfig = [];
        const registeredTags = new Set();
        const tagColorMap = {};

        // 🖱️ 가름선 드래그 로직 개선
        let isResizing = false;

        resizer.addEventListener('mousedown', function(e) {
            isResizing = true;
            resizer.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;
            const workspaceRect = workspace.getBoundingClientRect();
            // 마우스 위치에 따른 픽셀 너비 계산
            const newWidth = e.clientX - workspaceRect.left;
            
            // 양쪽 구역이 최소 200px은 유지하도록 제한
            if (newWidth > 200 && newWidth < workspaceRect.width - 200) {
                mainEditor.style.flex = 'none';
                mainEditor.style.width = newWidth + 'px';
                sidebarRight.style.flex = '1'; 
            }
        });

        document.addEventListener('mouseup', function() {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('dragging');
                document.body.style.removeProperty('cursor');
                document.body.style.removeProperty('user-select');
            }
        });

        function getRandomColor() {
            const letters = '6789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * letters.length)];
            }
            return color;
        }

        function checkAndRegisterTag(tagName) {
            if (!tagName || registeredTags.has(tagName)) return;
            registeredTags.add(tagName);

            let defaultBg = '#212121';
            if (tagName.toLowerCase() === 'other' || tagName.toLowerCase() === '잡담') {
                defaultBg = '#424242';
            }
            tagColorMap[tagName] = defaultBg;

            const row = document.createElement('div');
            row.classList.add('tag-color-row');
            row.dataset.tag = tagName;
            
            const txtColor = getRandomColor();
            row.innerHTML = `
                <span style="color: ${txtColor};" title="더블클릭하여 태그 이름 수정">[${tagName}]</span>
                <input type="color" value="${defaultBg}">
            `;

            const nameLabel = row.querySelector('span');
            nameLabel.addEventListener('dblclick', () => {
                const currentTag = row.dataset.tag;
                const newTag = prompt('새로운 태그 이름을 입력하세요:', currentTag);
                if (newTag && newTag.trim() !== '' && currentTag !== newTag.trim()) {
                    const cleanedNewTag = newTag.trim();
                    
                    registeredTags.delete(currentTag);
                    registeredTags.add(cleanedNewTag);
                    tagColorMap[cleanedNewTag] = tagColorMap[currentTag];
                    delete tagColorMap[currentTag];

                    row.dataset.tag = cleanedNewTag;
                    nameLabel.textContent = `[${cleanedNewTag}]`;

                    document.querySelectorAll('.log-card').forEach(card => {
                        if (card.dataset.tab === currentTag) {
                            card.dataset.tab = cleanedNewTag;
                            const badge = card.querySelector('.tab-badge');
                            if (badge) {
                                badge.textContent = `[${cleanedNewTag}]`;
                                badge.title = cleanedNewTag;
                            }
                        }
                    });
                    updateAllCardsBackgroundColor();
                }
            });

            const colorInput = row.querySelector('input[type="color"]');
            colorInput.addEventListener('input', (e) => {
                tagColorMap[tagName] = e.target.value;
                updateAllCardsBackgroundColor();
            });

            tagColorContainer.appendChild(row);
            updateAllCardsBackgroundColor();
        }

        function cleanupUnusedTags() {
            const currentCards = document.querySelectorAll('.log-card');
            const activeTags = new Set();
            currentCards.forEach(card => {
                if (card.dataset.tab) activeTags.add(card.dataset.tab);
            });

            registeredTags.forEach(tag => {
                if (!activeTags.has(tag)) {
                    registeredTags.delete(tag);
                    delete tagColorMap[tag];
                    const tagRow = tagColorContainer.querySelector(`.tag-color-row[data-tag="${tag}"]`);
                    if (tagRow) tagRow.remove();
                }
            });

            if (mainLogContainer.querySelectorAll('.log-card').length === 0) mainLogContainer.classList.remove('has-items');
            if (subLogContainer.querySelectorAll('.log-card').length === 0) subLogContainer.classList.remove('has-items');
        }

        function updateAllCardsBackgroundColor() {
            const allCards = document.querySelectorAll('.log-card');
            allCards.forEach(card => {
                const cardTab = card.dataset.tab;
                if (tagColorMap[cardTab]) {
                    card.style.backgroundColor = tagColorMap[cardTab];
                }
            });
        }

        clearSubLogBtn.addEventListener('click', () => {
            if (confirm('서브 로그 구역의 카드를 모두 삭제하시겠습니까?')) {
                subLogContainer.innerHTML = '';
                subLogContainer.classList.remove('has-items');
                cleanupUnusedTags();
            }
        });

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());

        addCharBtn.addEventListener('click', () => {
            const charId = 'char_' + Date.now();
            const charRow = document.createElement('div');
            charRow.classList.add('char-item-row');
            charRow.dataset.id = charId;

            charRow.innerHTML = `
                <button class="char-delete-btn">X</button>
                <div class="char-inline">
                    <input type="text" class="char-name" placeholder="캐릭터 이름">
                    <input type="color" class="char-color" value="#ffffff">
                </div>
                <input type="text" class="char-avatar-url" placeholder="두상 이미지 주소 (URL)">
                <label class="checkbox-label">
                    <input type="checkbox" class="char-hide-name"> 이름 숨기기 (GM 캐릭터용)
                </label>
            `;

            charRow.querySelector('.char-delete-btn').addEventListener('click', () => {
                charRow.remove();
                updateCharactersConfig();
            });

            charRow.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', updateCharactersConfig);
            });

            characterListContainer.appendChild(charRow);
            updateCharactersConfig();
        });

        function updateCharactersConfig() {
            charactersConfig = [];
            const rows = characterListContainer.querySelectorAll('.char-item-row');
            rows.forEach(row => {
                charactersConfig.push({
                    name: row.querySelector('.char-name').value.trim(),
                    color: row.querySelector('.char-color').value,
                    avatar: row.querySelector('.char-avatar-url').value.trim(),
                    hide: row.querySelector('.char-hide-name').checked
                });
            });
            document.querySelectorAll('.log-card').forEach(card => applyCharacterStyleToCard(card));
        }

        function applyCharacterStyleToCard(card) {
            const originalSpeaker = card.dataset.originalSpeaker;
            const targetCfg = charactersConfig.find(c => c.name === originalSpeaker && c.name !== "");
            const avatarImg = card.querySelector('.card-avatar');
            const nameSpan = card.querySelector('.speaker-name');

            if (targetCfg) {
                nameSpan.style.color = targetCfg.color;
                card.dataset.color = targetCfg.color;
                if (targetCfg.avatar) {
                    avatarImg.src = targetCfg.avatar;
                    avatarImg.style.display = 'block';
                } else {
                    avatarImg.style.display = 'none';
                }
                if (targetCfg.hide) {
                    avatarImg.style.display = 'none';
                    nameSpan.style.visibility = 'hidden';
                    card.dataset.hide = "true";
                } else {
                    nameSpan.style.visibility = 'visible';
                    card.dataset.hide = "false";
                }
            } else {
                nameSpan.style.color = card.dataset.originalColor;
                card.dataset.color = card.dataset.originalColor;
                avatarImg.style.display = 'none';
                nameSpan.style.visibility = 'visible';
                card.dataset.hide = "false";
            }
        }

        setupDropZone(mainLogContainer, 'main');
        setupDropZone(subLogContainer, 'sub');

        function setupDropZone(container, targetType) {
            container.addEventListener('dragenter', (e) => { e.preventDefault(); container.classList.add('dragover'); });
            container.addEventListener('dragover', (e) => { e.preventDefault(); container.classList.add('dragover'); });
            container.addEventListener('dragleave', () => container.classList.remove('dragover'));

            container.addEventListener('drop', (e) => {
                e.preventDefault();
                container.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length === 0) return;

                Array.from(files).forEach(file => {
                    if (!file.name.endsWith('.html')) return;

                    // 📁 파일명에서 세션명 자동 추출 로직
                    if (targetType === 'main') {
                        const baseFileName = file.name.replace(/\.html$/i, '').replace(/\[.*?\]/g, '').trim();
                        if (baseFileName) {
                            sessionTitle.value = baseFileName;
                        }
                    }

                    let tabType = targetType;
                    const tagMatch = file.name.match(/\[(.*?)\]/);
                    
                    if (targetType === 'sub') {
                        tabType = (tagMatch && tagMatch[1]) ? tagMatch[1].trim() : 'other';
                    } else {
                        tabType = (tagMatch && tagMatch[1]) ? tagMatch[1].trim() : 'main';
                    }

                    checkAndRegisterTag(tabType);

                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const text = event.target.result;
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');
                        const paragraphs = doc.querySelectorAll('body > p, p.msg, div.msg');

                        let parsedList = [];
                        paragraphs.forEach((p, idx) => {
                            let speaker = '시스템';
                            let content = p.innerHTML;
                            let color = p.style.color || '#ffffff';

                            const spanTags = p.querySelectorAll('span');
                            if (spanTags.length >= 2) {
                                speaker = spanTags[1].textContent.trim();
                                content = spanTags[2] ? spanTags[2].innerHTML : spanTags[1].innerHTML;
                            }

                            content = content.replace(/^[\r\n\s]+|[\r\n\s]+$/g, '').trim();

                            parsedList.push({
                                tab: tabType,
                                index: idx,
                                color: color,
                                speaker: speaker,
                                content: content
                            });
                        });

                        parsedList.sort((a, b) => a.index - b.index);
                        if (parsedList.length > 0) container.classList.add('has-items');

                        parsedList.forEach(log => {
                            const card = createLogCard(log);
                            container.appendChild(card);
                        });
                        updateAllCardsBackgroundColor();
                    };
                    reader.readAsText(file, 'UTF-8');
                });
            });
        }

        function createLogCard(log) {
            const card = document.createElement('div');
            card.classList.add('log-card');
            card.setAttribute('draggable', 'true');
            card.dataset.tab = log.tab;
            card.dataset.originalColor = log.color;
            card.dataset.color = log.color;
            card.dataset.originalSpeaker = log.speaker;
            card.dataset.speaker = log.speaker;
            card.dataset.hide = "false";

            card.innerHTML = `
                <img class="card-avatar" alt="avatar">
                <span class="tab-badge" title="${log.tab}">[${log.tab}]</span>
                <span class="speaker-name">${log.speaker}</span>
                <span class="log-content">${log.content}</span>
            `;

            const contentSpan = card.querySelector('.log-content');
            contentSpan.addEventListener('dblclick', function(e) {
                e.stopPropagation();
                if (card.querySelector('.card-inline-editor')) return;

                card.setAttribute('draggable', 'false');

                const currentHTML = contentSpan.innerHTML;
                const textarea = document.createElement('textarea');
                textarea.classList.add('card-inline-editor');
                textarea.value = currentHTML;

                contentSpan.style.display = 'none';
                card.appendChild(textarea);
                textarea.focus();

                const finishEdit = () => {
                    let newValue = textarea.value;
                    if (newValue !== null && newValue.trim() !== '') {
                        newValue = newValue.replace(/^[\r\n\s]+|[\r\n\s]+$/g, '').trim();
                        contentSpan.innerHTML = newValue;
                    }
                    textarea.remove();
                    contentSpan.style.display = 'block';
                    card.setAttribute('draggable', 'true');
                };

                textarea.addEventListener('blur', finishEdit);
                textarea.addEventListener('keydown', function(evt) {
                    if (evt.key === 'Enter' && !evt.shiftKey) {
                        evt.preventDefault();
                        textarea.blur();
                    }
                });
            });

            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));

            applyCharacterStyleToCard(card);
            return card;
        }

        [mainLogContainer, subLogContainer].forEach(container => {
            container.addEventListener('dragover', e => {
                e.preventDefault();
                const draggingCard = document.querySelector('.dragging');
                if (draggingCard == null) return;
                container.classList.add('has-items');
                
                const afterElement = getDragAfterElement(container, e.clientY);
                if (afterElement == null) {
                    container.appendChild(draggingCard);
                } else {
                    container.insertBefore(draggingCard, afterElement);
                }
                updateAllCardsBackgroundColor();
            });
            
            container.addEventListener('drop', () => {
                setTimeout(cleanupUnusedTags, 50);
            });
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.log-card:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function processDiceMessage(htmlContent, useDiceColor) {
            let text = htmlContent.trim();
            if (text.includes('&gt;') || text.includes('＞') || text.includes('&lt;') || text.includes('🎰')) {
                let plainText = text.replace(/<[^>]*>/g, '').trim();
                let colorStyle = '';
                if (useDiceColor) {
                    if (plainText.endsWith('성공') || plainText.includes('성공 ')) {
                        colorStyle = ' style="color: #2bcb20 !important; font-weight: bold;"';
                    } else if (plainText.endsWith('실패') || plainText.includes('실패 ')) {
                        colorStyle = ' style="color: #c42121 !important; font-weight: bold;"';
                    }
                }

                if (colorStyle !== '') {
                    let words = ['대성공', '극대 성공', '특별 성공', '보통 성공', '성공', '치명적 실패', '대실패', '펌블', '실패'];
                    for (let w of words) {
                        if (text.endsWith(w)) {
                            let idx = text.lastIndexOf(w);
                            text = text.substring(0, idx) + `<span${colorStyle}>${w}</span>`;
                            break;
                        }
                    }
                }
                return `<div class="dice-box">${text}</div>`;
            }
            return `<span class="char-msg-content">${text}</span>`;
        }

        // 1. HTML 코드를 생성하는 공통 함수
        function generateFinalHTML() {
            const finalCards = mainLogContainer.querySelectorAll('.log-card');
            if (finalCards.length === 0) {
                alert('메인 로그가 없습니다!');
                return null;
            }

            let chatLogHTML = '';
            let colorMap = {};
            let colorCounter = 1;
            
            const isHideContinuousActive = hideContinuousName.checked;
            const useDiceColor = enableColoringDice.checked;

            let backgroundStyles = '';
            const usedTagsInSession = new Set();

            const processedLogs = [];
            finalCards.forEach(card => {
                const speaker = card.dataset.originalSpeaker;
                const color = card.dataset.color;
                const tab = card.dataset.tab; 
                let content = card.querySelector('.log-content').innerHTML;
                
                content = content.replace(/^[\r\n\s]+|[\r\n\s]+$/g, '').trim();

                const targetCfg = charactersConfig.find(c => c.name === speaker && c.name !== "");
                const isForceHidden = !!(targetCfg && targetCfg.hide);

                usedTagsInSession.add(tab);
                if (!colorMap[color]) {
                    colorMap[color] = `p_c${colorCounter++}`;
                }

                processedLogs.push({
                    speaker, colorClass: colorMap[color], tab, content, targetCfg, isForceHidden, color
                });
            });

            for(let i = 0; i < processedLogs.length; i++) {
                const cur = processedLogs[i];
                const prev = processedLogs[i - 1];
                const next = processedLogs[i + 1];

                let isContinued = false;
                if (isHideContinuousActive && prev && prev.speaker === cur.speaker && prev.tab === cur.tab && !cur.isForceHidden && !prev.isForceHidden) {
                    isContinued = true;
                }
                if (cur.isForceHidden) isContinued = true;

                let nextIsContinued = false;
                if (isHideContinuousActive && next && next.speaker === cur.speaker && next.tab === cur.tab && !next.isForceHidden && !cur.isForceHidden) {
                    nextIsContinued = true;
                }
                if (next && next.isForceHidden) nextIsContinued = true;

                let positionClass = 'line-single';
                if (!isContinued && nextIsContinued) {
                    positionClass = 'line-start';
                } else if (isContinued && nextIsContinued) {
                    positionClass = 'line-middle';
                } else if (isContinued && !nextIsContinued) {
                    positionClass = 'line-end';
                }

                let displaySpeaker = (cur.isForceHidden || isContinued) ? '' : cur.speaker;
                
                let avatarHTML = '';
                let hasAvatarClass = ' no-avatar-configured';
                if (cur.targetCfg && cur.targetCfg.avatar && !cur.isForceHidden) {
                    hasAvatarClass = ' has-avatar-configured';
                    const avatarClass = isContinued ? 'res-avatar continued-avatar' : 'res-avatar';
                    avatarHTML = `<img src="${cur.targetCfg.avatar}" class="${avatarClass}" alt="avatar">`;
                } else {
                    avatarHTML = `<div class="res-avatar empty-avatar"></div>`;
                }

                const formattedContent = processDiceMessage(cur.content, useDiceColor);
                const cleanTabClass = "tag-" + btoa(encodeURIComponent(cur.tab)).replace(/=/g, "");
                const continuedClass = isContinued ? ' continued-line' : '';

                chatLogHTML += `      <div class="ccb-player${continuedClass} ${positionClass}${hasAvatarClass} ${cur.colorClass} ${cleanTabClass}">\r\n        ${avatarHTML}\r\n        <div class="ccb-text-wrap">\r\n          <b class="char-name-label">${displaySpeaker}</b>\r\n          ${formattedContent}\r\n        </div>\r\n      </div>\r\n`;
            }

            let checkboxListHTML = '';
            const rows = tagColorContainer.querySelectorAll('.tag-color-row');
            rows.forEach(row => {
                const tag = row.dataset.tag;
                const bgCol = row.querySelector('input[type="color"]').value;
                const cleanTabClass = "tag-" + btoa(encodeURIComponent(tag)).replace(/=/g, "");
                
                backgroundStyles += `#cocoback div.ccb-player.${cleanTabClass} { background-color: ${bgCol}; }\r\n`;
                backgroundStyles += `#cocoback.hide-${cleanTabClass} div.ccb-player.${cleanTabClass} { display: none !important; }\r\n`;
                checkboxListHTML += `<label><input type="checkbox" class="tab-toggle-chk" data-target="${cleanTabClass}" checked> ${tag}</label>`;
            });

            let dynamicStyle = '';
            for (let [color, className] of Object.entries(colorMap)) {
                dynamicStyle += `#cocoback .${className} b { color: ${color} !important; }\r\n`;
            }

            const titleName = sessionTitle.value.trim() || 'assembled_session_log';
            
            const finalOutputHTML = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${titleName}</title><style>\r
@font-face {\r
    font-family: 'Pretendard';\r
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');\r
    font-weight: 400;\r
    font-display: swap;\r
}\t\r
#cocoback { position: relative; background: #212121; padding: 0; }\r

#cocoback #tr_title { color: #fff; font-size: 22px; font-weight: bold; margin: 0; padding: 0; display: inline-block; }\r
#cocoback #ccb-btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 14px; font-size: 13px; border-radius: 4px; cursor: pointer; transition: 0.2s; display: inline-block;}\r

\r
/* 🎴 개별 로그 기본 배치 구조 */\r

${backgroundStyles}\r

#cocoback div.ccb-player.continued-line.no-avatar-configured .res-avatar { visibility: hidden; display: block; }\r
\r
${dynamicStyle}\r
</style></head><body>\r

  <div id="tr_top">\r
    <p id="tr_title">${titleName}</p>\r
    <button id="ccb-btn">탭 목록 열기</button>\r
  </div>\r

    ${checkboxListHTML}\r
  </div>\r

${chatLogHTML}  </div></div><script>\r
    const ccbBtn = document.getElementById('ccb-btn');\r
    const ccbLst = document.getElementById('ccb-lst');\r
    const cocoback = document.getElementById('cocoback');\r
    \r
    if(ccbBtn && ccbLst) {\r
        ccbBtn.onclick = function() {\r
            const isShow = ccbLst.classList.toggle('show');\r
            ccbBtn.textContent = isShow ? '탭 목록 닫기' : '탭 목록 열기';\r
        }\r
    }\r
\r
    document.querySelectorAll('.tab-toggle-chk').forEach(chk => {\r
        chk.addEventListener('change', function() {\r
            const targetClass = this.dataset.target;\r
            if(!this.checked) {\r
                cocoback.classList.add('hide-' + targetClass);\r
            } else {\r
                cocoback.classList.remove('hide-' + targetClass);\r
            }\r
        });\r
    });\r
<\/script></body></html>`;

            return { html: finalOutputHTML, titleName: titleName };
        }

        // 2. 다운로드 버튼 이벤트
        saveBtn.addEventListener('click', function() {
            const result = generateFinalHTML();
            if (!result) return;

            const blob = new Blob([result.html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${result.titleName}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // 3. 복사 버튼 이벤트
        const copyBtn = document.getElementById('copyBtn');
        if (copyBtn) {
            copyBtn.addEventListener('click', function() {
                const result = generateFinalHTML();
                if (!result) return;
                
                navigator.clipboard.writeText(result.html).then(() => {
                    alert('변환된 HTML 코드가 클립보드에 복사되었습니다.');
                }).catch(err => {
                    alert('복사 실패: ' + err);
                });
            });
        }
    </script>
