<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연근표 코코포 로그 백업기 v2</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --sidebar-bg: #252538;
            --box-bg: #2d2d44;
            --text-color: #cdd6f4;
            --accent-color: #74c7ec;
            --border-color: #45475a;
            --danger-color: #f38ba8;
            --success-color: #a6e3a1;
        }

        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }

        .container { display: flex; width: 100%; height: 100%; position: relative; }

        /* Sidebar Left */
        .sidebar-left {
            width: 340px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; gap: 20px;
            box-sizing: border-box; overflow-y: auto; flex-shrink: 0; transition: width 0.3s, padding 0.3s;
            position: relative;
        }
        .sidebar-left.collapsed { width: 0; padding: 0; overflow: hidden; border: none; }
        
        .sidebar-toggle-btn {
            position: absolute; left: 340px; top: 15px; width: 24px; height: 40px;
            background: var(--sidebar-bg); border: 1px solid var(--border-color); border-left: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 100; border-radius: 0 4px 4px 0; transition: left 0.3s; color: var(--text-color);
            font-size: 12px;
        }
        .sidebar-left.collapsed + .sidebar-toggle-btn { left: 0; }

        /* Workspace */
        .workspace { flex: 1; display: flex; height: 100%; overflow: hidden; }
        .main-editor, .sidebar-right { display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; height: 100%; }
        .main-editor { width: 50%; background: var(--bg-color); }
        .sidebar-right { flex: 1; background: var(--sidebar-bg); border-left: 1px solid var(--border-color); }
        .resizer { width: 6px; background: var(--border-color); cursor: col-resize; transition: background 0.2s; z-index: 10; flex-shrink: 0; }
        .resizer:hover, .resizer.dragging { background: var(--accent-color); }

        /* Headers & Configs */
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 8px; min-height: 32px; }
        .sidebar-header h3 { margin: 0; color: var(--accent-color); font-size: 16px; }
        .header-actions { display: flex; gap: 6px; align-items: center; }

        /* Collapsible */
        .collapsible-header { cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; margin: 0; font-size: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; color: var(--accent-color); }
        .collapsible-header:hover { opacity: 0.8; }
        .toggle-icon { font-size: 12px; transition: 0.2s; }
        .collapsible-content { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .collapsible-content.hidden { display: none; }

        .config-group { display: flex; flex-direction: column; gap: 8px; font-size: 14px; background: #1e1e2e; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        .config-group input[type="text"], .config-group select { background: var(--box-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 8px; border-radius: 4px; box-sizing: border-box; font-size: 13px; width: 100%; }
        
        .macro-box { background: #313244; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; border: 1px dashed #cba6f7; }

        /* Tag & Character Management */
        .tag-color-row, .char-item-row { background: var(--box-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px;}
        .tag-color-row { flex-direction: row; align-items: center; justify-content: space-between; }
        .tag-color-row span { font-weight: bold; font-size: 14px; word-break: break-all; cursor: pointer; user-select: none; }
        .tag-color-row span:hover { color: var(--accent-color) !important; text-decoration: underline; }
        
        .char-header { display: flex; gap: 6px; align-items: center; }
        .char-header input[type="text"] { flex: 1; }
        .char-header input[type="color"], .tag-color-row input[type="color"] { width: 35px; height: 28px; padding: 0; border: none; cursor: pointer; background: none; flex-shrink: 0; }
        
        .avatar-list { display: flex; flex-direction: column; gap: 4px; padding-left: 10px; border-left: 2px solid var(--border-color); }
        .avatar-row { display: flex; gap: 4px; align-items: center; }
        .avatar-row input.avatar-name { width: 60px; }
        .avatar-row input.avatar-url { flex: 1; }
        .del-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-weight: bold; padding: 0 4px; }
        
        /* Search Bar */
        .search-container { display: none; gap: 4px; margin-bottom: 8px; width: 100%; align-items: center; background: #11111b; padding: 6px; border-radius: 6px; border: 1px solid var(--accent-color); box-sizing: border-box; }
        .search-container.active { display: flex; }
        .search-input { flex: 1; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--box-bg); color: #fff; font-size: 13px; }
        .search-nav-btn { background: var(--box-bg); border: 1px solid var(--border-color); color: #fff; cursor: pointer; border-radius: 4px; padding: 4px 8px; font-size: 11px; }
        .search-nav-btn:hover { background: var(--border-color); }
        .search-count { font-size: 12px; color: var(--accent-color); min-width: 45px; text-align: center; }

        /* Pagination */
        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
        .page-btn { background: var(--box-bg); border: 1px solid var(--border-color); color: var(--text-color); cursor: pointer; padding: 2px 8px; border-radius: 4px; }
        .page-btn:hover { background: var(--border-color); }
        .page-number-display { cursor: text; user-select: none; font-weight: bold; min-width: 40px; text-align: center; }
        
        /* Log Area */
        .log-container { flex: 1; background: #11111b; border: 2px dashed var(--border-color); border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; transition: 0.2s; position: relative; }
        .log-container.dragover { border-color: var(--accent-color) !important; background: #313244 !important; }
        .log-container::before { content: "로그 파일을 끌어다 놓으세요. (자동 파싱)"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #585b70; font-size: 13px; pointer-events: none; }
        .log-container.has-items::before { display: none; }

        .log-card { background: #212121; border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 6px; cursor: grab; user-select: none; font-size: 14px; line-height: 1.4; display: flex; align-items: flex-start; gap: 10px; transition: border-color 0.2s, box-shadow 0.2s; }
        .log-card:active { cursor: grabbing; }
        .log-card.dragging { opacity: 0.3; border: 1px dashed var(--accent-color); }
        .log-card:hover:not(.search-highlight) { box-shadow: inset 0 0 0 1px var(--accent-color); }
        .log-card.search-highlight { border: 2px solid var(--danger-color); box-shadow: 0 0 8px rgba(243, 139, 168, 0.5); }

        .card-avatar { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; object-position: top center; border: 1px solid var(--border-color); background: #45475a; display: none; margin-top: 2px; flex-shrink: 0; }
        .card-avatar.clickable { cursor: pointer; transition: 0.2s; }
        .card-avatar.clickable:hover { opacity: 0.7; border-color: var(--accent-color); }
        
        .tab-badge { font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #89b4fa; color: #11111b; cursor: pointer; margin-top: 2px; flex-shrink: 0; }
        .speaker-name { font-weight: bold; min-width: 85px; max-width: 85px; text-align: right; border-right: 2px solid var(--border-color); padding-right: 10px; cursor: pointer; margin-top: 2px; word-break: break-all; flex-shrink: 0; }
        .speaker-name:hover, .tab-badge:hover { opacity: 0.8; text-decoration: underline; }
        
        .log-content-wrap { flex: 1; word-break: break-all; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .log-content { display: block; }
        
        .inline-select { width: auto; max-width: 130px; font-size: 12px; padding: 2px; background: #11111b; color: #fff; border: 1px solid var(--accent-color); overflow: hidden; text-overflow: ellipsis; }
        .card-inline-editor { width: 100%; background: #11111b; color: #fff; border: 1px solid var(--accent-color); padding: 4px 6px; font-size: 14px; font-family: inherit; border-radius: 4px; resize: vertical; min-height: 40px; box-sizing: border-box; }

        /* Buttons & Checks */
        .action-btn { background: var(--accent-color); color: #11111b; border: none; padding: 8px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px; width: 100%; box-sizing: border-box; }
        .action-btn:hover { opacity: 0.9; }
        .sub-btn { background: #89b4fa; color: #11111b; border: none; padding: 4px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .sub-btn:hover { opacity: 0.9; }
        .clear-btn { background: var(--danger-color); color: #11111b; border: none; padding: 4px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .clear-btn:hover { opacity: 0.9; }
        .checkbox-label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar-left" id="sidebarLeft">
            <!-- 1. 기본 설정 -->
            <div class="config-group" style="background: none; border: none; padding: 0;">
                <h3 style="margin:0; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; color: var(--accent-color);">기본 설정</h3>
                <input type="text" id="sessionTitle" value="" placeholder="세션명 입력">
                <label class="checkbox-label"><input type="checkbox" id="hideContinuousName" checked> 연속 발언 시 이름 생략</label>
                <label class="checkbox-label"><input type="checkbox" id="enableColoringDice" checked> 판정 결과 색상 강조</label>
            </div>

            <!-- 2. 탭 설정 -->
            <div class="config-group">
                <h3 class="collapsible-header" onclick="toggleCollapse(this)">🏷️ 탭 설정 <span class="toggle-icon">△</span></h3>
                <div id="tagColorContainer" class="collapsible-content"></div>
            </div>

            <!-- 3. 캐릭터 자동/수동 관리 -->
            <div class="config-group">
                <h3 class="collapsible-header" onclick="toggleCollapse(this)">👥 캐릭터 설정 <span class="toggle-icon">△</span></h3>
                <div class="collapsible-content" id="characterListContainer">
                    <!-- Javascript rendered here -->
                </div>
            </div>
            
            <!-- 4. 사담 로그 일괄 변환 -->
            <div class="config-group">
                <h3 class="collapsible-header" onclick="toggleCollapse(this)">💬 잡담 캐릭터 설정 <span class="toggle-icon">△</span></h3>
                <div class="collapsible-content macro-box">
                    <span style="font-size: 12px; color: #a6adc8;">other/잡담 탭에서 아래 입력한 캐릭터를 일괄 변환합니다.</span>
                    <input type="text" id="macroChatName" placeholder="사담용 캐릭터 이름 (예: PL)">
                    <div style="display: flex; gap: 6px; align-items: center;">
                        <input type="color" id="macroChatColor" value="#cccccc" style="width: 40px; height: 30px; border:none; padding:0; background:none;">
                        <span style="font-size:12px;">이름 색</span>
                    </div>
                    <input type="text" id="macroChatAvatar" placeholder="두상 이미지 주소 (URL)">
                    <input type="text" id="macroTargetChars" placeholder="변경할 대상 (예: 탐사자1, 탐사자2)">
                    <button class="action-btn" id="applyMacroBtn" style="background: #cba6f7;">적용하기</button>
                </div>
            </div>

            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
                <button class="action-btn" id="copyBtn" style="background:#f9e2af; padding: 12px; font-size: 15px;">📋 클립보드에 복사</button>
                <button class="action-btn" id="saveBtn" style="background:var(--success-color); padding: 12px; font-size: 15px;">💾 변환 파일 다운로드</button>
            </div>
        </div>
        
        <div class="sidebar-toggle-btn" id="sidebarToggle" title="설정창 접기/펴기">◀</div>

        <div class="workspace" id="workspace">
            <div class="main-editor" id="mainEditor">
                <div class="sidebar-header">
                    <h3>📝 메인 로그</h3>
                </div>
                <!-- Search UI -->
                <div class="search-container" id="mainSearchContainer">
                    <input type="text" class="search-input" id="mainSearchInput" placeholder="대사 검색">
                    <span class="search-count" id="mainSearchCount">0/0</span>
                    <button class="search-nav-btn" onclick="navigateSearch('main', -1)">▲</button>
                    <button class="search-nav-btn" onclick="navigateSearch('main', 1)">▼</button>
                </div>
                <!-- Pagination -->
                <div class="pagination-container">
                    <button class="page-btn" onclick="changePage('main', -1)">◀</button>
                    <span class="page-number-display" id="mainPageDisplay">1 / 1</span>
                    <button class="page-btn" onclick="changePage('main', 1)">▶</button>
                </div>
                <div class="log-container" id="mainLogContainer" data-type="main"></div>
            </div>

            <div class="resizer" id="resizer"></div>

            <div class="sidebar-right" id="sidebarRight">
                <div class="sidebar-header">
                    <h3>📥 서브 로그</h3>
                    <div class="header-actions">
                        <button class="sub-btn" id="mergeBtn">합치기</button>
                        <select id="separateSelect" class="sub-btn" style="background: #cba6f7; padding: 3px; max-width: 100px;">
                            <option value="">탭 분리</option>
                        </select>
                        <button class="clear-btn" id="clearSubLogBtn">비우기</button>
                    </div>
                </div>
                <!-- Search UI -->
                <div class="search-container" id="subSearchContainer">
                    <input type="text" class="search-input" id="subSearchInput" placeholder="대사 검색">
                    <span class="search-count" id="subSearchCount">0/0</span>
                    <button class="search-nav-btn" onclick="navigateSearch('sub', -1)">▲</button>
                    <button class="search-nav-btn" onclick="navigateSearch('sub', 1)">▼</button>
                </div>
                <!-- Pagination -->
                <div class="pagination-container">
                    <button class="page-btn" onclick="changePage('sub', -1)">◀</button>
                    <span class="page-number-display" id="subPageDisplay">1 / 1</span>
                    <button class="page-btn" onclick="changePage('sub', 1)">▶</button>
                </div>
                <div class="log-container" id="subLogContainer" data-type="sub"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 상태 및 상수 ---
        let logsData = { main: [], sub: [] };
        let charactersConfig = {}; // { '이름': { color: '#fff', hide: false, avatars: [{name:'기본', url:''}] } }
        let registeredTags = new Set();
        let tagColorMap = {};
        
        let currentPages = { main: 1, sub: 1 };
        const ITEMS_PER_PAGE = 15;

        // 검색 상태
        let searchStates = {
            main: { query: '', results: [], index: -1 },
            sub: { query: '', results: [], index: -1 }
        };

        // Undo/Redo
        let undoStack = [], redoStack = [], isRestoring = false;

        // --- DOM Elements ---
        const mainLogContainer = document.getElementById('mainLogContainer');
        const subLogContainer = document.getElementById('subLogContainer');
        const characterListContainer = document.getElementById('characterListContainer');
        const separateSelect = document.getElementById('separateSelect');

        // --- 유틸리티 ---
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function getRandomColor() { return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0'); }

        // 토글 버튼 (△ ▽)
        window.toggleCollapse = function(header) {
            const content = header.nextElementSibling;
            const icon = header.querySelector('.toggle-icon');
            content.classList.toggle('hidden');
            icon.textContent = content.classList.contains('hidden') ? '▽' : '△';
        };

        // 사이드바 접기
        document.getElementById('sidebarToggle').addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebarLeft');
            sidebar.classList.toggle('collapsed');
            e.target.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        });

        // --- 상태 관리 ---
        function saveState() {
            if (isRestoring) return;
            const state = JSON.stringify({ logs: logsData, chars: charactersConfig });
            if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== state) {
                undoStack.push(state);
                if (undoStack.length > 30) undoStack.shift();
                redoStack = [];
            }
        }
        function restoreState(stateStr) {
            isRestoring = true;
            const state = JSON.parse(stateStr);
            logsData = state.logs; charactersConfig = state.chars;
            syncTagsFromData(); renderCharacterConfigUI(); renderAll();
            isRestoring = false;
        }
        function undo() { if (undoStack.length > 1) { redoStack.push(undoStack.pop()); restoreState(undoStack[undoStack.length - 1]); } }
        function redo() { if (redoStack.length > 0) { const state = redoStack.pop(); undoStack.push(state); restoreState(state); } }

        // --- 마크다운 & 정리 ---
        function parseMarkdown(text) {
            let res = text.replace(/\*\*\*(.*?)\*\*\*/g, '<b><i>$1</i></b>');
            res = res.replace(/\*\*(.*?)\*\*/g, '<i>$1</i>');
            return res.replace(/\*(.*?)\*/g, '<b>$1</b>');
        }
        function stripBrAndSpaces(text) {
            return text.replace(/^(?:<br\s*\/?>|\s)+|(?:<br\s*\/?>|\s)+$/gi, '');
        }

        // --- 단축키 텍스트 감싸기 토글 ---
        function toggleWrap(ta, w) {
            const s = ta.selectionStart;
            const e = ta.selectionEnd;
            const t = ta.value;
            const wl = w.length;

            // 바깥쪽에 이미 감싸져 있는지 확인 (예: *텍스트* 지정 시)
            const before = t.substring(Math.max(0, s - wl), s);
            const after = t.substring(e, e + wl);
            
            if (before === w && after === w) {
                // 특수문자 제거하고 블록 유지
                ta.value = t.substring(0, s - wl) + t.substring(s, e) + t.substring(e + wl);
                ta.selectionStart = s - wl;
                ta.selectionEnd = e - wl;
                return;
            }
            
            // 안쪽에 이미 감싸져 있는지 확인 (예: 별표까지 포함해서 드래그 시)
            const insideBefore = t.substring(s, s + wl);
            const insideAfter = t.substring(e - wl, e);
            
            if (e - s >= wl * 2 && insideBefore === w && insideAfter === w) {
                // 특수문자 제거하고 텍스트만 블록 유지
                ta.value = t.substring(0, s) + t.substring(s + wl, e - wl) + t.substring(e);
                ta.selectionStart = s;
                ta.selectionEnd = e - wl * 2;
                return;
            }

            // 감싸져 있지 않으면 새로 추가하고 블록 유지
            ta.value = t.substring(0, s) + w + t.substring(s, e) + w + t.substring(e);
            ta.selectionStart = s + wl;
            ta.selectionEnd = e + wl;
        }

        // --- 태그 관리 ---
        function registerTag(tagName) {
            if (!tagName || registeredTags.has(tagName)) return;
            registeredTags.add(tagName);
            let defaultBg = (tagName.toLowerCase() === 'other' || tagName.toLowerCase() === '잡담') ? '#424242' : '#212121';
            tagColorMap[tagName] = defaultBg;
            
            const row = document.createElement('div'); row.className = 'tag-color-row'; row.dataset.tag = tagName;
            row.innerHTML = `<span style="color: ${getRandomColor()};">[${tagName}]</span><input type="color" value="${defaultBg}">`;
            
            row.querySelector('span').addEventListener('dblclick', () => {
                const newTag = prompt('새로운 탭 이름:', tagName);
                if (newTag && newTag.trim() && tagName !== newTag.trim()) {
                    const cleanTag = newTag.trim();
                    registeredTags.delete(tagName); registeredTags.add(cleanTag);
                    tagColorMap[cleanTag] = tagColorMap[tagName]; delete tagColorMap[tagName];
                    ['main', 'sub'].forEach(t => logsData[t].forEach(l => { if (l.tab === tagName) l.tab = cleanTag; }));
                    row.dataset.tag = cleanTag; row.querySelector('span').textContent = `[${cleanTag}]`;
                    updateSeparateDropdown(); saveState(); renderAll();
                }
            });

            // 실시간 탭 배경색 반영 (드래그 중)
            const colorInput = row.querySelector('input');
            colorInput.addEventListener('input', (e) => { 
                tagColorMap[row.dataset.tag] = e.target.value; 
                renderAll(); 
            });
            // 저장(Undo 스택)은 마우스 클릭 해제 시 1번만
            colorInput.addEventListener('change', () => { saveState(); });

            document.getElementById('tagColorContainer').appendChild(row);
            updateSeparateDropdown();
        }

        function syncTagsFromData() {
            const activeTags = new Set();
            ['main', 'sub'].forEach(t => logsData[t].forEach(l => activeTags.add(l.tab)));
            activeTags.forEach(tag => registerTag(tag));
            Array.from(registeredTags).forEach(tag => {
                if (!activeTags.has(tag)) {
                    registeredTags.delete(tag); delete tagColorMap[tag];
                    const row = document.querySelector(`.tag-color-row[data-tag="${tag}"]`);
                    if (row) row.remove();
                }
            });
            updateSeparateDropdown();
        }

        // --- 캐릭터 관리 ---
        function renderCharacterConfigUI() {
            characterListContainer.innerHTML = '';
            Object.keys(charactersConfig).forEach(charName => {
                const cfg = charactersConfig[charName];
                const charRow = document.createElement('div'); charRow.className = 'char-item-row';
                
                // Header
                let headerHTML = `
                    <div class="char-header">
                        <button class="del-btn" title="캐릭터 삭제">X</button>

        // --- 검색 (Ctrl+F) 네비게이션 ---
        function runSearch(type) {
            const q = document.getElementById(`${type}SearchInput`).value.trim().toLowerCase();
            searchStates[type].query = q;
            const countEl = document.getElementById(`${type}SearchCount`);
            
            if (!q) {
                searchStates[type].results = []; searchStates[type].index = -1;
                countEl.textContent = '0/0'; renderList(type); return;
            }
            
            searchStates[type].results = logsData[type].filter(l => l.rawContent.toLowerCase().includes(q)).map(l => l.id);
            searchStates[type].index = searchStates[type].results.length > 0 ? 0 : -1;
            
            updateSearchUI(type);
            if (searchStates[type].results.length > 0) jumpToSearchMatch(type);
            else renderList(type);
        }

        function navigateSearch(type, dir) {
            const st = searchStates[type];
            if (st.results.length === 0) return;
            st.index += dir;
            if (st.index < 0) st.index = st.results.length - 1;
            if (st.index >= st.results.length) st.index = 0;
            updateSearchUI(type); jumpToSearchMatch(type);
        }

        function updateSearchUI(type) {
            const st = searchStates[type];
            document.getElementById(`${type}SearchCount`).textContent = st.results.length > 0 ? `${st.index + 1}/${st.results.length}` : '0/0';
        }

        function jumpToSearchMatch(type) {
            const st = searchStates[type];
            if (st.index === -1) return;
            const targetId = st.results[st.index];
            const logIdx = logsData[type].findIndex(l => l.id === targetId);
            if (logIdx === -1) return;

            const page = Math.floor(logIdx / ITEMS_PER_PAGE) + 1;
            currentPages[type] = page;
            renderList(type); 
            
            setTimeout(() => {
                const card = document.querySelector(`.log-card[data-id="${targetId}"]`);
                if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }, 50);
        }

        document.getElementById('mainSearchInput').addEventListener('input', () => runSearch('main'));
        document.getElementById('subSearchInput').addEventListener('input', () => runSearch('sub'));
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                ['main', 'sub'].forEach(type => {
                    const box = document.getElementById(`${type}SearchContainer`);
                    box.classList.toggle('active');
                    if (!box.classList.contains('active')) {
                        document.getElementById(`${type}SearchInput`).value = ''; runSearch(type);
                    }
                });
                if(document.getElementById('mainSearchContainer').classList.contains('active')) document.getElementById('mainSearchInput').focus();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                e.preventDefault(); if (e.shiftKey) redo(); else undo();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                e.preventDefault(); redo();
            }
        });

        // --- 렌더링 ---
        window.changePage = function(type, delta) {
            const maxPage = Math.max(1, Math.ceil(logsData[type].length / ITEMS_PER_PAGE));
            currentPages[type] = Math.max(1, Math.min(maxPage, currentPages[type] + delta));
            renderList(type);
        }

        function setupPageInput(type) {
            const display = document.getElementById(`${type}PageDisplay`);
            display.addEventListener('dblclick', () => {
                const input = document.createElement('input'); input.type = 'number';
                input.style.width = '40px'; input.value = currentPages[type];
                display.style.display = 'none'; display.parentNode.insertBefore(input, display); input.focus();
                
                const finish = () => {
                    const maxPage = Math.max(1, Math.ceil(logsData[type].length / ITEMS_PER_PAGE));
                    let val = parseInt(input.value);
                    if (!isNaN(val)) currentPages[type] = Math.max(1, Math.min(maxPage, val));
                    input.remove(); display.style.display = ''; renderList(type);
                };
                input.addEventListener('blur', finish);
                input.addEventListener('keydown', e => { if(e.key === 'Enter') finish(); });
            });
        }
        setupPageInput('main'); setupPageInput('sub');

        function renderAll() { renderList('main'); renderList('sub'); }

        function renderList(type) {
            const container = document.getElementById(`${type}LogContainer`);
            const display = document.getElementById(`${type}PageDisplay`);
            container.innerHTML = '';
            
            const list = logsData[type];
            const maxPage = Math.max(1, Math.ceil(list.length / ITEMS_PER_PAGE));
            if (currentPages[type] > maxPage) currentPages[type] = maxPage;
            display.textContent = `${currentPages[type]} / ${maxPage}`;

            container.classList.toggle('has-items', list.length > 0);

            const startIdx = (currentPages[type] - 1) * ITEMS_PER_PAGE;
            const slice = list.slice(startIdx, startIdx + ITEMS_PER_PAGE);
            
            const searchHighlightTarget = searchStates[type].index > -1 ? searchStates[type].results[searchStates[type].index] : null;

            slice.forEach(log => container.appendChild(createLogCardDOM(log, type, searchHighlightTarget)));
        }

        // --- 카드 DOM 생성 ---
        function createLogCardDOM(log, containerType, highlightTargetId) {

            if (highlightTargetId === log.id) card.classList.add('search-highlight');

            const targetCfg = charactersConfig[log.speaker];
            let displayColor = targetCfg ? targetCfg.color : log.color;
            let visibility = (targetCfg && targetCfg.hide) ? 'visibility:hidden;' : '';
            
            let displayAvatarUrl = ''; let hasAvatar = false;
            if (targetCfg && targetCfg.avatars && targetCfg.avatars.length > 0) {
                hasAvatar = true;
                const savedAvatar = targetCfg.avatars.find(a => a.name === log.avatarName);
                displayAvatarUrl = savedAvatar ? savedAvatar.url : targetCfg.avatars[0].url;
            }

            card.innerHTML = `
                <img class="card-avatar ${targetCfg && targetCfg.avatars.length > 1 ? 'clickable' : ''}" src="${displayAvatarUrl}" ${displayAvatarUrl ? 'style="display:block;"' : ''} title="두상 클릭하여 변경">
                <span class="tab-badge" title="탭 변경">[${log.tab}]</span>
                <span class="speaker-name" style="color: ${displayColor}; ${visibility}" title="캐릭터 변경">${log.speaker}</span>
                <div class="log-content-wrap">
                    <span class="log-content">${parseMarkdown(log.rawContent)}</span>
                </div>
            `;

            // 다중 아바타 선택
            const avatarImg = card.querySelector('.card-avatar');
            if (hasAvatar && targetCfg.avatars.length > 1) {
                avatarImg.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (card.querySelector('.avatar-select')) return;
                    const select = document.createElement('select'); select.className = 'inline-select avatar-select';
                    targetCfg.avatars.forEach(a => {
                        const opt = document.createElement('option'); opt.value = a.name; opt.textContent = a.name;
                        if (a.name === (log.avatarName || targetCfg.avatars[0].name)) opt.selected = true;
                        select.appendChild(opt);
                    });
                    avatarImg.style.display = 'none'; card.insertBefore(select, avatarImg); select.focus();
                    const finish = () => { log.avatarName = select.value; saveState(); renderList(containerType); };
                    select.addEventListener('blur', finish); select.addEventListener('change', finish);
                });
            }

            // 탭/캐릭터 인라인 수정
            const badge = card.querySelector('.tab-badge');
            badge.addEventListener('click', (e) => {
                e.stopPropagation(); if (card.querySelector('select:not(.avatar-select)')) return;
                const select = document.createElement('select'); select.className = 'inline-select';
                Array.from(registeredTags).forEach(t => {
                    const opt = document.createElement('option'); opt.value = t; opt.textContent = `[${t}]`;
                    if (t === log.tab) opt.selected = true; select.appendChild(opt);
                });
                badge.style.display = 'none'; card.insertBefore(select, badge); select.focus();
                const finish = () => { log.tab = select.value; saveState(); syncTagsFromData(); renderAll(); };
                select.addEventListener('blur', finish); select.addEventListener('change', finish);
            });

            const nameEl = card.querySelector('.speaker-name');
            nameEl.addEventListener('click', (e) => {
                e.stopPropagation(); if (card.querySelector('select:not(.avatar-select)')) return;
                const select = document.createElement('select'); select.className = 'inline-select';
                const opts = new Set(Object.keys(charactersConfig)); opts.add('시스템');
                opts.forEach(c => {
                    const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
                    if (c === log.speaker) opt.selected = true; select.appendChild(opt);
                });
                nameEl.style.display = 'none'; card.insertBefore(select, nameEl); select.focus();
                const finish = () => { log.speaker = select.value; saveState(); renderAll(); };
                select.addEventListener('blur', finish); select.addEventListener('change', finish);
            });

            // 본문 수정 및 단축키 토글 기능 반영
            const contentSpan = card.querySelector('.log-content');
            contentSpan.addEventListener('dblclick', (e) => {
                e.stopPropagation(); if (card.querySelector('.card-inline-editor')) return;
                card.draggable = false;
                const textarea = document.createElement('textarea'); textarea.className = 'card-inline-editor';
                textarea.value = log.rawContent; contentSpan.style.display = 'none';
                card.querySelector('.log-content-wrap').appendChild(textarea); textarea.focus();

                const finish = () => {
                    let cleaned = stripBrAndSpaces(textarea.value);
                    if (!cleaned) {
                        if (confirm('대사가 비어있어 해당 카드가 삭제됩니다. 진행하시겠습니까?')) {
                            logsData[containerType] = logsData[containerType].filter(l => l.id !== log.id);
                        }
                    } else {
                        log.rawContent = cleaned;
                    }
                    saveState(); renderList(containerType);
                };
                textarea.addEventListener('blur', finish);
                
                // 단축키 기능 (토글 및 영역 유지 적용)
                textarea.addEventListener('keydown', (evt) => {
                    if (evt.ctrlKey || evt.metaKey) {
                        if (evt.key.toLowerCase() === 'b') { 
                            evt.preventDefault(); 
                            toggleWrap(textarea, '*'); // 기존 * 설정대로 굵게 적용 
                        }
                        else if (evt.key.toLowerCase() === 'i') { 
                            evt.preventDefault(); 
                            toggleWrap(textarea, '**'); // 기존 ** 설정대로 기울임 적용
                        }
                    } else if (evt.key === 'Enter' && !evt.shiftKey) { 
                        evt.preventDefault(); textarea.blur();

            card.addEventListener('dragstart', e => { card.classList.add('dragging'); e.dataTransfer.setData('text/plain', log.id); e.dataTransfer.setData('sourceType', containerType); });
            card.addEventListener('dragend', () => card.classList.remove('dragging'));

        // --- 드래그 앤 드롭 정렬 ---
        function setupDragDrop(container, type) {
            container.addEventListener('dragover', e => {
                e.preventDefault(); const dragging = document.querySelector('.dragging'); if (!dragging) return;
                container.classList.add('dragover');
                const afterEl = getDragAfterElement(container, e.clientY);
                if (!afterEl) container.appendChild(dragging); else container.insertBefore(dragging, afterEl);
            });
            container.addEventListener('dragleave', () => container.classList.remove('dragover'));
            container.addEventListener('drop', e => {
                e.preventDefault(); container.classList.remove('dragover');
                const draggedId = e.dataTransfer.getData('text/plain'); if (!draggedId) return;
                
                let sourceLog, sourceListType;
                ['main', 'sub'].forEach(t => { const idx = logsData[t].findIndex(l => l.id === draggedId); if (idx > -1) { sourceLog = logsData[t].splice(idx, 1)[0]; sourceListType = t; } });
                
                if (sourceLog) {
                    const afterEl = getDragAfterElement(container, e.clientY);
                    let targetList = logsData[type];
                    if (afterEl) {
                        const tIdx = targetList.findIndex(l => l.id === afterEl.dataset.id);
                        if (tIdx > -1) targetList.splice(tIdx, 0, sourceLog); else targetList.push(sourceLog);
                    } else targetList.push(sourceLog);
                    saveState(); syncTagsFromData(); renderAll();
                }
            });
        }
        setupDragDrop(mainLogContainer, 'main'); setupDragDrop(subLogContainer, 'sub');

        function getDragAfterElement(container, y) {
            return [...container.querySelectorAll('.log-card:not(.dragging)')].reduce((closest, child) => {
                const box = child.getBoundingClientRect(), offset = y - box.top - box.height / 2;
                return (offset < 0 && offset > closest.offset) ? { offset, element: child } : closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // --- 파일 파싱 ---
        window.addEventListener('dragover', e => e.preventDefault()); window.addEventListener('drop', e => e.preventDefault());
        function setupFileDrop(container, targetType) {
            container.addEventListener('drop', e => {
                const files = e.dataTransfer.files; if (files.length === 0) return;
                let charsAdded = false;
                Array.from(files).forEach(file => {
                    if (!file.name.endsWith('.html')) return;
                    if (targetType === 'main' && !document.getElementById('sessionTitle').value) document.getElementById('sessionTitle').value = file.name.replace(/\.html$/i, '').replace(/\[.*?\]/g, '').trim();

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const doc = new DOMParser().parseFromString(event.target.result, 'text/html');
                        let newLogs = [];

                        if (doc.querySelector('#cocoback')) {
                            // 자체 백업기 파싱
                            doc.querySelectorAll('.ccb-player').forEach(p => {
                                let speaker = p.querySelector('.char-name-label')?.textContent.trim() || '시스템';
                                let content = p.querySelector('.char-msg-content, .dice-box')?.innerHTML || '';
                                content = stripBrAndSpaces(content); if(!content) return;
                                
                                let tab = 'main';
                                p.classList.forEach(c => { if(c.startsWith('tag-')) try{ tab = decodeURIComponent(atob(c.replace('tag-',''))); } catch(e){} });
                                
                                if (speaker !== '시스템' && !charactersConfig[speaker]) { charactersConfig[speaker] = { color: '#ffffff', hide: false, avatars: [{name:'기본', url:''}] }; charsAdded = true; }
                                newLogs.push({ id: generateId(), tab, speaker, color: '#ffffff', rawContent: content });
                            });
                        } else {
                            // 코코포리아 일반 로그 파싱
                            const defaultTab = (file.name.match(/\[(.*?)\]/)?.[1]?.trim()) || (targetType === 'sub' ? 'other' : 'main');
                            doc.querySelectorAll('body > p, p.msg, div.msg').forEach(p => {
                                let tab = defaultTab, speaker = '시스템', content = p.innerHTML;
                                const spanTags = p.querySelectorAll('span');
                                if (spanTags.length >= 3) {
                                    const tagMatch = spanTags[0].textContent.match(/\[(.*?)\]/);
                                    if (tagMatch) tab = tagMatch[1].trim();
                                    speaker = spanTags[1].textContent.trim();
                                    content = spanTags[2].innerHTML;
                                } else if (spanTags.length === 2) {
                                    speaker = spanTags[0].textContent.trim(); content = spanTags[1].innerHTML;
                                }
                                content = stripBrAndSpaces(content); if(!content) return;
                                const pColor = p.style.color || '#ffffff';
                                if (speaker !== '시스템' && !charactersConfig[speaker]) { charactersConfig[speaker] = { color: pColor, hide: false, avatars: [{name:'기본', url:''}] }; charsAdded = true; }
                                newLogs.push({ id: generateId(), tab, speaker, color: pColor, rawContent: content });
                            });
                        }
                        if (newLogs.length > 0) {
                            logsData[targetType].push(...newLogs);
                            syncTagsFromData(); saveState(); 
                            if(charsAdded) renderCharacterConfigUI();
                            renderAll();
                        }
                    };
                    reader.readAsText(file, 'UTF-8');
                });
            });
        }
        setupFileDrop(mainLogContainer, 'main'); setupFileDrop(subLogContainer, 'sub');

        // --- 출력 다이스 결과 및 간격 ---
        function processDiceMessage(htmlContent, useDiceColor) {
            let text = htmlContent.trim();
            if (text.includes('&gt;') || text.includes('＞') || text.includes('&lt;') || text.includes('🎰')) {
                if (useDiceColor) {
                    const plain = text.replace(/<[^>]*>/g, '');
                    const greens = ['어려운 성공', '대단한 성공', '극대 성공', '특별 성공', '보통 성공', '대성공', '성공'];
                    const reds = ['치명적 실패', '대실패', '펌블', '실패'];
                    let matched = false;
                    for (let w of greens) {
                        if (plain.endsWith(w) || plain.includes(w + ' ')) {
                            text = text.replace(new RegExp(w + '(?![^<]*>)', 'g'), `<span style="color: #2bcb20 !important; font-weight: bold;">${w}</span>`);
                            matched = true; break;
                        }
                    }
                    if (!matched) {
                        for (let w of reds) {
                            if (plain.endsWith(w) || plain.includes(w + ' ')) {
                                text = text.replace(new RegExp(w + '(?![^<]*>)', 'g'), `<span style="color: #c42121 !important; font-weight: bold;">${w}</span>`);
                                break;
                            }
                        }
                    }
                }
                return `<div class="dice-box">${text}</div>`;
            }
            return `<span class="char-msg-content">${text}</span>`;
        }

        function generateFinalHTML() {
            if (logsData.main.length === 0) { alert('메인 로그가 없습니다!'); return null; }
            let chatLogHTML = '', bgStyles = '', colorStyles = '', colorMap = {}, colorCnt = 1;
            const hideCont = document.getElementById('hideContinuousName').checked;
            const useDice = document.getElementById('enableColoringDice').checked;

            const procs = logsData.main.map(log => {
                const targetCfg = charactersConfig[log.speaker];
                const finalColor = targetCfg ? targetCfg.color : log.color;
                if (!colorMap[finalColor]) colorMap[finalColor] = `p_c${colorCnt++}`;
                
                let avatarUrl = '';
                if (targetCfg && targetCfg.avatars.length > 0) {
                    const matched = targetCfg.avatars.find(a => a.name === log.avatarName);
                    avatarUrl = matched ? matched.url : targetCfg.avatars[0].url;
                }

                return {
                    speaker: log.speaker, colorClass: colorMap[finalColor], tab: log.tab,
                    content: parseMarkdown(log.rawContent), isForceHidden: !!(targetCfg && targetCfg.hide), avatarUrl
                };
            });

            for(let i = 0; i < procs.length; i++) {
                const cur = procs[i], prev = procs[i-1], next = procs[i+1];
                let isCont = (hideCont && prev && prev.speaker === cur.speaker && prev.tab === cur.tab && !cur.isForceHidden && !prev.isForceHidden) || cur.isForceHidden;
                let nextCont = (hideCont && next && next.speaker === cur.speaker && next.tab === cur.tab && !next.isForceHidden && !cur.isForceHidden) || (next && next.isForceHidden);

                let posClass = (!isCont && nextCont) ? 'line-start' : (isCont && nextCont) ? 'line-middle' : (isCont && !nextCont) ? 'line-end' : 'line-single';
                let hasAv = (cur.avatarUrl && !cur.isForceHidden) ? ' has-avatar-configured' : ' no-avatar-configured';
                let avHTML = (cur.avatarUrl && !cur.isForceHidden) ? `<img src="${cur.avatarUrl}" class="res-avatar ${isCont ? 'continued-avatar' : ''}" alt="avatar">` : `<div class="res-avatar empty-avatar"></div>`;
                
                const cTab = "tag-" + btoa(encodeURIComponent(cur.tab)).replace(/=/g, "");
                chatLogHTML += `<div class="ccb-player ${isCont?'continued-line':''} ${posClass}${hasAv} ${cur.colorClass} ${cTab}">\n${avHTML}\n<div class="ccb-text-wrap">\n<b class="char-name-label">${(cur.isForceHidden || isCont)?'':cur.speaker}</b>\n${processDiceMessage(cur.content, useDice)}\n</div>\n</div>\n`;
            }

            let chksHTML = '';
            Array.from(registeredTags).forEach(t => {
                const cTab = "tag-" + btoa(encodeURIComponent(t)).replace(/=/g, "");
                bgStyles += `#cocoback div.ccb-player.${cTab} { background-color: ${tagColorMap[t] || '#212121'}; }\n#cocoback.hide-${cTab} div.ccb-player.${cTab} { display: none !important; }\n`;
                chksHTML += `<label><input type="checkbox" class="tab-toggle-chk" data-target="${cTab}" checked> ${t}</label>`;
            });
            for (let [col, cls] of Object.entries(colorMap)) colorStyles += `#cocoback .${cls} b { color: ${col} !important; }\n`;

            const title = document.getElementById('sessionTitle').value.trim() || 'assembled_session_log';
            const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${title}</title><style>\n@font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2'); }\n#cocoback { position: relative; background: #212121; padding: 0; }\n#cocoback, #cocoback * { line-height: 1.2; font-family: 'Pretendard', sans-serif !important; box-sizing: border-box; }\n#cocoback #tr_top { padding: 15px 3%; width: 94%; height: 30px; background: #212121; display: flex !important; align-items: center; justify-content: space-between;}\n#cocoback #tr_title { color: #fff; font-size: 22px; font-weight: bold; margin: 0; }\n#cocoback #ccb-btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 14px; font-size: 13px; border-radius: 4px; cursor: pointer; }\n#cocoback #ccb-lst { display: none; background: #2a2a2a; padding: 15px 4%; border-bottom: 1px dashed #444; }\n#cocoback #ccb-lst.show { display: flex; flex-wrap: wrap; gap: 16px; }\n#cocoback #ccb-lst label { display: inline-flex; align-items: center; gap: 6px; color: #ccc; font-size: 14px; cursor: pointer; user-select: none; }\n#cocoback #tr_talks { padding: 25px 4% 60px 4%; background: #212121; display: flex; flex-direction: column; }\n#cocoback div.ccb-player { margin: 0; padding: 10px 30px; display: flex; gap: 14px; align-items: flex-start; word-break: break-all; min-height: 66px; }\n${bgStyles}\n#cocoback .res-avatar { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; object-position: top center; border: 1px solid #3a3a3a; background: #2a2a2a; flex-shrink: 0; }\n#cocoback .empty-avatar { border: none; background: transparent; }\n#cocoback .continued-avatar { display: none; }\n#cocoback .ccb-text-wrap { display: flex; flex-direction: column; gap: 10px; flex: 1; padding-top: 2px; min-width:0; }\n#cocoback .char-name-label { font-size: 16px; font-weight: bold; color: #fff; display: block; }\n#cocoback .char-msg-content { font-size: 15px; color: #e0e0e0; line-height: 1.5; display: block; }\n#cocoback .dice-box { background: #111111; border: 1px solid #3a3a3a; border-radius: 6px; padding: 10px 14px; font-size: 14px; color: #ffffff; line-height: 1.5; display: inline-block; width: fit-content; max-width: 100%; }\n#cocoback div.ccb-player.line-start { padding-top: 15px !important; padding-bottom: 2px !important; min-height: unset !important; }\n#cocoback div.ccb-player.line-middle { padding-top: 2px !important; padding-bottom: 2px !important; min-height: unset !important; }\n#cocoback div.ccb-player.line-end { padding-top: 2px !important; padding-bottom: 15px !important; min-height: unset !important; }\n#cocoback div.ccb-player.continued-line .char-name-label { display: none; }\n#cocoback div.ccb-player.continued-line .ccb-text-wrap { gap: 0; }\n#cocoback div.ccb-player.continued-line.has-avatar-configured { padding-left: 94px; }\n#cocoback div.ccb-player.continued-line.has-avatar-configured .res-avatar { display: none; }\n#cocoback div.ccb-player.continued-line.no-avatar-configured .res-avatar { visibility: hidden; display: block; }\n${colorStyles}\n</style></head><body>\n<div id="cocoback">\n<div id="tr_top"><p id="tr_title">${title}</p><button id="ccb-btn">탭 목록 열기</button></div>\n<div id="ccb-lst">\n${chksHTML}\n</div>\n<div id="tr_talks">\n${chatLogHTML}</div></div><script>\ndocument.getElementById('ccb-btn').onclick=function(){const lst=document.getElementById('ccb-lst');const s=lst.classList.toggle('show');this.textContent=s?'탭 목록 닫기':'탭 목록 열기';};\ndocument.querySelectorAll('.tab-toggle-chk').forEach(c=>c.addEventListener('change',function(){document.getElementById('cocoback').classList.toggle('hide-'+this.dataset.target,!this.checked);}));\n<\/script></body></html>`;
            return { html, title };
        }

        document.getElementById('saveBtn').addEventListener('click', () => {
            const res = generateFinalHTML(); if(!res) return;
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([res.html], { type: 'text/html' }));
            a.download = `${res.title}.html`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });
        document.getElementById('copyBtn').addEventListener('click', () => {
            const res = generateFinalHTML(); if(!res) return;
            navigator.clipboard.writeText(res.html).then(()=>alert('복사되었습니다.')).catch(e=>alert('실패: '+e));
        });

        window.addEventListener('DOMContentLoaded', () => { saveState(); renderCharacterConfigUI(); });
    </script>
</body>
</html>
